# Name is local to your Fly account. `fly launch --no-deploy` can rewrite it.
# Do not put X402_PAY_TO or X402_FACILITATOR_TOKEN in this file.
app = "x402-priceboard"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1

[env]
  PORT = "8080"
  FEATURED_PATH = "/data/featured.json"

# Create with: fly volumes create priceboard_data --size 1 --region iad
[[mounts]]
  source = "priceboard_data"
  destination = "/data"
